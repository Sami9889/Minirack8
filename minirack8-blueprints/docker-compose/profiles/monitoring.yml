version: "3.9"

networks:
  minirack:
    driver: bridge

volumes:
  grafana_config:
  prometheus_config:
  influxdb_config:

services:
  grafana:
    image: grafana/grafana:latest
    container_name: minirack-grafana
    restart: unless-stopped
    networks:
      - minirack
    ports:
      - "3002:3000"
    volumes:
      - grafana_config:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 256m
    profiles:
      - monitoring
      - homelab
      - dev
      - full

  prometheus:
    image: prom/prometheus:latest
    container_name: minirack-prometheus
    restart: unless-stopped
    networks:
      - minirack
    ports:
      - "9090:9090"
    volumes:
      - prometheus_config:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    deploy:
      resources:
        limits:
          memory: 512m
    profiles:
      - monitoring
      - homelab
      - dev
      - full

  influxdb:
    image: influxdb:latest
    container_name: minirack-influxdb
    restart: unless-stopped
    networks:
      - minirack
    ports:
      - "8086:8086"
    volumes:
      - influxdb_config:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=changeme
      - DOCKER_INFLUXDB_INIT_ORG=minirack
      - DOCKER_INFLUXDB_INIT_BUCKET=minirack
    deploy:
      resources:
        limits:
          memory: 512m
    profiles:
      - monitoring
      - homelab
      - dev
      - full
