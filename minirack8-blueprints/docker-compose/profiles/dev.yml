version: "3.9"

networks:
  minirack:
    driver: bridge

volumes:
  gitea_config:
  gitea_data:
  drone_config:

services:
  gitea:
    image: gitea/gitea:latest
    container_name: minirack-gitea
    restart: unless-stopped
    networks:
      - minirack
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - gitea_data:/data
      - gitea_config:/etc/gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite
    deploy:
      resources:
        limits:
          memory: 512m
    profiles:
      - dev
      - full

  drone:
    image: drone/drone:latest
    container_name: minirack-drone
    restart: unless-stopped
    networks:
      - minirack
    ports:
      - "8081:80"
      - "443:443"
    volumes:
      - drone_config:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DRONE_GITEA_SERVER=http://gitea:3000
      - DRONE_GITEA_CLIENT_ID=YOUR_CLIENT_ID
      - DRONE_GITEA_CLIENT_SECRET=YOUR_CLIENT_SECRET
      - DRONE_RPC_SECRET=YOUR_RPC_SECRET
      - DRONE_SERVER_HOST=drone.local
      - DRONE_SERVER_PROTO=http
    deploy:
      resources:
        limits:
          memory: 512m
    profiles:
      - dev
      - full

  code-server:
    image: codercom/code-server:latest
    container_name: minirack-code-server
    restart: unless-stopped
    networks:
      - minirack
    ports:
      - "8443:8443"
    environment:
      - PUID=1000
      - PGID=1000
    deploy:
      resources:
        limits:
          memory: 1g
    profiles:
      - dev
      - full
