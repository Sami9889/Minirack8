version: "3.9"

networks:
  minirack:
    driver: bridge

volumes:
  pihole_config:
  pihole_dns:
  wireguard_config:

services:
  pihole:
    image: pihole/pihole:latest
    container_name: minirack-pihole
    restart: unless-stopped
    networks:
      - minirack
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8082:80/tcp"
    volumes:
      - pihole_config:/etc/pihole
      - pihole_dns:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
    environment:
      - TZ=America/New_York
      - WEBPASSWORD=changeme
    deploy:
      resources:
        limits:
          memory: 256m
    profiles:
      - networking
      - full

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: minirack-wireguard
    restart: unless-stopped
    networks:
      - minirack
    ports:
      - "51820:51820/udp"
    volumes:
      - wireguard_config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - SERVERPORT=51820
      - PEERS=3
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    deploy:
      resources:
        limits:
          memory: 128m
    profiles:
      - networking
      - full
